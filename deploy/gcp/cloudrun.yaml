apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ai-defense-layer
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containers:
        - image: gcr.io/<PROJECT_ID>/ai-defense-layer:latest
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: GRPC_SERVER_PORT
              value: "9090"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "<KAFKA_BOOTSTRAP_SERVERS>"
            - name: OPENAI_API_KEY
              value: "<OPENAI_API_KEY>"
          resources:
            limits:
              cpu: "1000m"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/defense/health
              port: 8080
            failureThreshold: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/defense/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/defense/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
